<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz cumpleaños, Valen 💗</title>

  <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.) -->

  <meta name="theme-color" content="#ffdfee" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Para Valen" />
  <meta property="og:locale" content="es_CR" />
  <meta property="og:url" content="https://juan080305.github.io/MotivacionVale-/" />
  <meta property="og:title" content="Feliz cumpleaños, Valen 💗" />
  <meta property="og:description" content="Chawu tiene algo que decirte 🐾" />
  <meta property="og:image" content="https://juan080305.github.io/MotivacionVale-/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Feliz cumpleaños, Valen" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Feliz cumpleaños, Valen 💗" />
  <meta name="twitter:description" content="Chawu tiene algo que decirte 🐾" />
  <meta name="twitter:image" content="https://juan080305.github.io/MotivacionVale-/preview.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --bg1:#fff6fb;
      --bg2:#ffdfee;
      --bg3:#fff0f6;
      --leaf1:#3f9d67;
      --leaf2:#62b37d;
      --leaf3:#2d7d52;
      --shadow: rgba(88, 26, 58, 0.18);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.85), transparent 28%),
        radial-gradient(circle at 80% 15%, rgba(255,255,255,.65), transparent 20%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      color:#6b1d45;
    }

    .wrap{
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      position:relative;
      padding:18px 12px 14px;
      gap:14px;
    }

    .sparkles{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
    .sparkles span{
      position:absolute;
      width:10px;height:10px;
      border-radius:50%;
      background:rgba(255,255,255,.8);
      box-shadow:0 0 18px rgba(255,255,255,.75);
      animation: float 7s linear infinite;
      opacity:.9;
    }
    .sparkles span:nth-child(1){left:8%; top:15%; animation-delay:0s;}
    .sparkles span:nth-child(2){left:20%; top:72%; width:7px;height:7px; animation-delay:1s;}
    .sparkles span:nth-child(3){left:84%; top:22%; width:8px;height:8px; animation-delay:2s;}
    .sparkles span:nth-child(4){left:71%; top:65%; width:6px;height:6px; animation-delay:3s;}
    .sparkles span:nth-child(5){left:50%; top:10%; width:9px;height:9px; animation-delay:4s;}
    .sparkles span:nth-child(6){left:38%; top:52%; width:6px;height:6px; animation-delay:5s;}
    @keyframes float{
      0%{transform:translateY(0) scale(.8); opacity:.2;}
      50%{opacity:1;}
      100%{transform:translateY(-22px) scale(1.2); opacity:.1;}
    }

    .message{
      position:relative;
      flex:0 0 auto;
      text-align:center;
      z-index:7;
      width:min(600px, 100%);
      padding:15px 20px 16px;
      background:rgba(255,255,255,.52);
      backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,.6);
      border-radius:26px;
      box-shadow:0 14px 38px var(--shadow);
    }
    .message h1{
      margin:0;
      font-size:clamp(1.5rem, 5vw, 2.6rem);
      line-height:1.08;
      color:#a61f62;
      text-shadow: 0 2px 0 rgba(255,255,255,.7);
      letter-spacing:.5px;
    }
    .lead{
      margin:8px 0 0;
      font-size:clamp(.92rem, 2.8vw, 1.05rem);
      color:#813256;
    }
    .kicker{
      margin:11px 0 0;
      font-style:italic;
      color:#9a4b71;
      font-size:clamp(.86rem, 2.7vw, .96rem);
    }

    .music-row{margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
    .music-btn{
      appearance:none;
      border:none;
      cursor:pointer;
      font-family:inherit;
      border-radius:999px;
      padding:12px 18px;
      text-decoration:none;
      font-size:0.98rem;
      font-weight:bold;
      color:white;
      background:linear-gradient(180deg, #ff6ca5, #d93b80);
      box-shadow:0 10px 22px rgba(166,31,98,.24);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .music-btn:hover{transform:translateY(-2px); box-shadow:0 14px 26px rgba(166,31,98,.3);}
    .music-btn:active{transform:translateY(1px) scale(.98);}
    .music-btn.ghost{
      color:#b3306e;
      background:rgba(255,255,255,.82);
      border:2px solid rgba(217,59,128,.35);
      box-shadow:0 8px 18px rgba(166,31,98,.14);
    }

    .cloudzone{
      flex:0 0 auto;
      position:relative;
      z-index:6;
      width:100%;
      display:flex;
      justify-content:center;
      padding-bottom:22px;
    }

    .scene{
      width:min(100%, 950px);
      flex:1 1 auto;
      min-height:230px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      position:relative;
      z-index:1;
    }

    .ground{
      position:absolute;
      left:0; right:0; bottom:0;
      height:82px;
      background:
        radial-gradient(circle at 20% 35%, rgba(255,255,255,.13), transparent 14%),
        radial-gradient(circle at 62% 30%, rgba(255,255,255,.08), transparent 11%),
        linear-gradient(180deg, #7a5238, #5a3928 74%, #4a2e21);
      border-radius:46% 46% 0 0 / 18% 18% 0 0;
      box-shadow: inset 0 16px 30px rgba(255,255,255,.08), 0 -4px 18px rgba(0,0,0,.08);
    }

    .flowers{
      position:relative;
      width:100%;
      height:min(36vh, 320px);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:1vw;
      padding:0 5vw 52px;
      z-index:2;
    }

    /* ---------------- LIRIOS ---------------- */
    .lily{
      --scale:1;
      --p1:#fff4f9; --p2:#ff9ec4; --p3:#ff5d99; --p4:#d92f74;
      --throat:#ffe9a8; --speck: rgba(190, 26, 90, .5);
      position:relative;
      width:92px;
      height:270px;
      transform-origin:bottom center;
      animation:sway 5.4s ease-in-out infinite;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.12));
      transform:scale(var(--scale));
    }
    .lily.amarillo{
      --p1:#fffdf0; --p2:#ffe08a; --p3:#ffc23d; --p4:#e89a12;
      --throat:#fff2c2; --speck: rgba(158, 96, 8, .45);
    }
    .lily.blanco{
      --p1:#ffffff; --p2:#fff7fb; --p3:#ffe4f0; --p4:#f3c3d8;
      --throat:#e8f6c8; --speck: rgba(196, 132, 165, .38);
    }
    .lily:nth-child(2){animation-delay:.6s}
    .lily:nth-child(3){animation-delay:1.4s}
    .lily:nth-child(4){animation-delay:2.1s}
    .lily:nth-child(5){animation-delay:2.7s}
    @keyframes sway{
      0%,100%{ transform: translateY(0) rotate(-2deg) scale(var(--scale));}
      50%{ transform: translateY(-4px) rotate(2deg) scale(var(--scale));}
    }

    .stem{
      position:absolute;
      bottom:26px;
      left:50%;
      width:9px;
      height:138px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, #5cb87d, var(--leaf1) 40%, var(--leaf3));
      border-radius:12px;
      box-shadow: inset -2px 0 3px rgba(255,255,255,.35), inset 3px 0 4px rgba(0,0,0,.08);
    }

    .leaf{
      position:absolute;
      width:62px;
      height:17px;
      background:linear-gradient(90deg, var(--leaf3), var(--leaf2));
      border-radius:100% 0 100% 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    }
    .leaf:after{
      content:"";
      position:absolute;
      left:10%; top:50%;
      width:76%; height:2px;
      background:rgba(255,255,255,.28);
      transform:translateY(-50%) rotate(-3deg);
      border-radius:2px;
    }
    .leaf.l1{ right:42px; bottom:106px; transform:rotate(31deg); transform-origin:right center;}
    .leaf.l2{ left:42px;  bottom:80px; transform:rotate(-31deg) scaleX(-1); transform-origin:left center;}
    
    .bloom{
      position:absolute;
      left:50%; top:2px;
      width:150px; height:150px;
      transform:translateX(-50%);
    }
    .petal{
      position:absolute;
      left:50%; top:50%;
      width:36px; height:74px;
      margin-left:-18px; margin-top:-74px;
      transform-origin:50% 100%;
      background:
        radial-gradient(ellipse 60% 40% at 50% 92%, var(--throat) 0%, rgba(255,255,255,0) 62%),
        linear-gradient(180deg, var(--p4) 0%, var(--p3) 26%, var(--p2) 62%, var(--p1) 100%);
      clip-path: polygon(50% 0%, 63% 9%, 74% 26%, 78% 48%, 72% 72%, 58% 92%, 50% 100%, 42% 92%, 28% 72%, 22% 48%, 26% 26%, 37% 9%);
      box-shadow: 0 4px 10px rgba(158, 39, 97, .1);
    }
    .petal:before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        radial-gradient(circle, var(--speck) 45%, transparent 46%),
        radial-gradient(circle, var(--speck) 45%, transparent 46%),
        radial-gradient(circle, var(--speck) 45%, transparent 46%),
        radial-gradient(circle, var(--speck) 45%, transparent 46%),
        radial-gradient(circle, var(--speck) 45%, transparent 46%),
        radial-gradient(circle, var(--speck) 45%, transparent 46%);
      background-size:5px 5px;
      background-repeat:no-repeat;
      background-position: 42% 62%, 58% 70%, 46% 78%, 60% 84%, 38% 86%, 52% 90%;
      opacity:.85;
    }
    .petal:after{
      content:"";
      position:absolute;
      left:50%; top:8%;
      width:2px; height:80%;
      transform:translateX(-50%);
      background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12));
      border-radius:4px;
    }
    .petal.o1{transform:rotate(0deg);   z-index:2}
    .petal.o2{transform:rotate(120deg); z-index:2}
    .petal.o3{transform:rotate(240deg); z-index:2}
    .petal.i1{transform:rotate(60deg);  z-index:3; width:40px; margin-left:-20px;}
    .petal.i2{transform:rotate(180deg); z-index:3; width:40px; margin-left:-20px;}
    .petal.i3{transform:rotate(300deg); z-index:3; width:40px; margin-left:-20px;}

    .heart-center{
      position:absolute;
      left:50%; top:50%;
      width:34px;height:34px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle at 50% 45%, var(--throat) 0%, rgba(255,255,255,0) 70%);
      z-index:4;
    }
    .stamen{
      position:absolute;
      left:50%; top:50%;
      width:2.6px; height:38px;
      margin-left:-1.3px; margin-top:-38px;
      transform-origin:50% 100%;
      background:linear-gradient(180deg, #d8c274, #a8c46a);
      border-radius:3px;
      z-index:5;
    }
    .stamen:after{
      content:"";
      position:absolute;
      top:-7px; left:50%;
      width:12px; height:7px;
      transform:translateX(-50%) rotate(-16deg);
      background:linear-gradient(180deg,#d1703a,#9c4519);
      border-radius:50%;
      box-shadow:0 1px 2px rgba(0,0,0,.18);
    }
    .stamen.a1{transform:rotate(18deg)}
    .stamen.a2{transform:rotate(78deg)}
    .stamen.a3{transform:rotate(138deg)}
    .stamen.a4{transform:rotate(198deg)}
    .stamen.a5{transform:rotate(258deg)}
    .stamen.a6{transform:rotate(318deg)}
    .pistil{
      position:absolute;
      left:50%; top:50%;
      width:3.4px;height:46px;
      margin-left:-1.7px; margin-top:-46px;
      transform-origin:50% 100%;
      background:linear-gradient(180deg,#8fbf63,#c9d98a);
      border-radius:4px;
      z-index:6;
    }
    .pistil:after{
      content:"";
      position:absolute;
      top:-5px; left:50%;
      width:9px;height:8px;
      transform:translateX(-50%);
      background:#7fae52;
      border-radius:50%;
    }
    .bud{
      position:absolute;
      left:50%; top:104px;
      width:22px;height:19px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, #6ec08c, #3f9d67);
      clip-path:polygon(12% 100%, 88% 100%, 70% 0%, 30% 0%);
      border-radius:0 0 8px 8px;
      z-index:1;
    }

    /* ---------------- CHAWU ---------------- */
    .dog-wrap{
      position:absolute;
      right:4vw;
      bottom:50px;
      width:min(252px, 40vw);
      z-index:3;
    }
    .dog{
      display:block;
      width:100%;
      height:auto;
      animation: dogbob 3.8s ease-in-out infinite;
      filter: drop-shadow(0 14px 16px rgba(0,0,0,.16));
      transform-origin:50% 100%;
    }
    @keyframes dogbob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-5px)}
    }
    .dog-wrap.barking .dog{ animation: bark .55s ease; }
    @keyframes bark{
      0%{transform:translateY(0) rotate(0) scale(1)}
      25%{transform:translateY(-12px) rotate(-4deg) scale(1.05)}
      55%{transform:translateY(3px) rotate(3deg) scale(.97)}
      80%{transform:translateY(-4px) rotate(-1deg) scale(1.01)}
      100%{transform:translateY(0) rotate(0) scale(1)}
    }

    .woof{
      position:absolute;
      left:2%;
      top:26%;
      transform:translateX(-100%) scale(.5);
      opacity:0;
      font-weight:bold;
      font-size:clamp(1.05rem, 3.2vw, 1.5rem);
      color:#d93b80;
      text-shadow:0 2px 0 #fff, 0 0 14px rgba(255,255,255,.9);
      pointer-events:none;
      white-space:nowrap;
    }
    .dog-wrap.barking .woof{ animation: woofpop .8s ease; }
    @keyframes woofpop{
      0%{opacity:0; transform:translateX(-92%) scale(.5)}
      25%{opacity:1; transform:translateX(-102%) scale(1.18)}
      60%{opacity:1; transform:translateX(-110%) scale(1)}
      100%{opacity:0; transform:translateX(-124%) translateY(-18px) scale(.95)}
    }

    /* ---------------- NUBECITA ---------------- */
    .thought{
      position:relative;
      width:min(440px, 100%);
      min-height:126px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:rgba(255,255,255,.97);
      color:#7b4a32;
      border:2px solid rgba(123,74,50,.16);
      border-radius:30px;
      padding:16px 20px;
      box-shadow:0 12px 28px rgba(0,0,0,.14);
      font-size:clamp(1rem, 2.9vw, 1.18rem);
      line-height:1.45;
      font-weight:bold;
      text-align:center;
      transform-origin:78% 120%;
    }
    .thought:before,
    .thought:after{
      content:"";
      position:absolute;
      background:rgba(255,255,255,.97);
      border:2px solid rgba(123,74,50,.16);
      border-radius:50%;
    }
    .thought:before{width:22px;height:22px;right:34px;bottom:-18px;}
    .thought:after{width:13px;height:13px;right:14px;bottom:-34px;}
    .thought.pop{ animation: pop .5s cubic-bezier(.2,1.5,.4,1); }
    @keyframes pop{
      0%{transform:scale(.55) translateY(14px); opacity:0}
      60%{transform:scale(1.07) translateY(0); opacity:1}
      100%{transform:scale(1); opacity:1}
    }
    .thought .cue{
      display:block;
      margin-top:8px;
      font-size:.78em;
      font-weight:normal;
      font-style:italic;
      color:#a9805f;
    }

    .name-tag{
      position:absolute;
      left:50%;
      bottom:-32px;
      transform:translateX(-50%);
      white-space:nowrap;
      z-index:4;
      background:rgba(255,255,255,.9);
      color:#7b4a32;
      border:2px solid rgba(123,74,50,.18);
      padding:8px 16px;
      border-radius:999px;
      font-size:clamp(.95rem, 2.8vw, 1.2rem);
      box-shadow:0 8px 18px rgba(0,0,0,.12);
      font-weight:bold;
      letter-spacing:.4px;
    }

    .tap{
      margin:8px 0 2px;
      font-size:.95rem;
      color:#9a4b71;
      opacity:.86;
      text-align:center;
      z-index:5;
    }


    /* ---------------- HUELLITAS DE PROGRESO ---------------- */
    .paws{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:4px;
      margin-top:10px;
      line-height:1;
    }
    .paw{
      font-size:12px;
      line-height:1;
      opacity:.2;
      filter:grayscale(1);
      transition:opacity .3s ease, filter .3s ease, transform .3s ease;
    }
    .paw.on{ opacity:1; filter:none; transform:scale(1.14); }

    /* ---------------- BOTON DE SONIDO ---------------- */
    .snd{
      position:absolute;
      top:10px; right:12px;
      appearance:none;
      border:none;
      cursor:pointer;
      width:32px; height:32px;
      border-radius:999px;
      font-size:14px;
      line-height:1;
      background:rgba(255,255,255,.75);
      box-shadow:0 4px 10px rgba(166,31,98,.14);
      transition:transform .12s ease;
    }
    .snd:active{ transform:scale(.92); }

    /* ---------------- FINAL ---------------- */
    .thought.final{
      background:linear-gradient(180deg,#fffdf5,#fff3f9);
      border-color:rgba(214,150,66,.4);
      box-shadow:0 14px 34px rgba(166,31,98,.2), 0 0 0 4px rgba(255,216,146,.4);
    }
    .thought.final:before,
    .thought.final:after{
      background:#fff8ef;
      border-color:rgba(214,150,66,.4);
    }
    .dog-sit{ display:none; }
    .dog-wrap.sentado .dog-stand{ display:none; }
    .dog-wrap.sentado .dog-sit{ display:block; }
    .dog-wrap.feliz .dog{ animation: felizbob 1.15s ease-in-out infinite; }
    @keyframes felizbob{
      0%,100%{transform:translateY(0) rotate(-2.5deg)}
      50%{transform:translateY(-10px) rotate(2.5deg)}
    }

    .petalos{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:19;}
    .petalo{
      position:absolute;
      top:-32px;
      width:13px; height:21px;
      border-radius:60% 40% 55% 45% / 72% 72% 28% 28%;
      opacity:0;
      box-shadow:0 2px 6px rgba(158,39,97,.16);
      animation:caer linear forwards;
    }
    @keyframes caer{
      0%{transform:translate(0,-32px) rotate(0deg); opacity:0;}
      12%{opacity:.95;}
      100%{transform:translate(var(--dx), 106vh) rotate(var(--gir)); opacity:.15;}
    }

    .heart-burst{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20;}
    .heart{
      position:absolute;
      font-size:20px;
      animation: rise 3.2s linear forwards;
      opacity:.9;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.12));
    }
    @keyframes rise{
      0%{transform:translateY(0) scale(.6) rotate(0deg); opacity:0;}
      15%{opacity:1;}
      100%{transform:translateY(-180px) scale(1.5) rotate(16deg); opacity:0;}
    }

    @media (max-width: 720px){
      .wrap{ padding:14px 10px 12px; gap:10px; }
      .message{ padding:13px 30px 14px 14px; border-radius:22px; }
      .paw{ font-size:11px; }
      .snd{ width:28px; height:28px; top:8px; right:8px; font-size:13px; }
      .music-btn{ padding:11px 15px; font-size:.92rem; }
      .cloudzone{ padding-bottom:20px; }
      .thought{
        width:100%;
        min-height:112px;
        padding:13px 15px;
        border-radius:24px;
        font-size:clamp(.98rem, 4vw, 1.1rem);
      }
      .scene{ min-height:210px; }
      .ground{ height:64px; }
      .flowers{
        gap:0;
        height:min(30vh, 260px);
        padding:0 0 44px;
        justify-content:space-evenly;
      }
      .lily{ --scale:.6; width:56px; }
      .dog-wrap{ right:3vw; width:48vw; max-width:206px; bottom:42px; }
      .name-tag{ bottom:-28px; padding:6px 13px; }
      .tap{ font-size:.85rem; }
    }

    @media (max-width: 720px) and (max-height: 700px){
      .flowers{ height:min(26vh, 210px); }
      .thought{ min-height:104px; }
      .scene{ min-height:180px; }
    }

    @media (prefers-reduced-motion: reduce){
      .lily, .dog, .sparkles span{animation:none !important}
    }
  </style>
</head>
<body>
  <div class="wrap" id="scene">
    <div class="sparkles">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="message">
      <button class="snd" id="sndBtn" type="button" aria-label="Activar o silenciar el ladrido">🔊</button>
      <h1>Feliz cumpleaños, Valen&nbsp;💗</h1>
      <p class="lead">18 vueltas al sol 🎂 Chawu tiene algo que decirte: hazlo ladrar 🐾</p>

          <ellipse cx="218" cy="120" rx="9" ry="6" fill="#e07ba6" opacity=".22"/>
          <ellipse cx="286" cy="118" rx="9" ry="6" fill="#e07ba6" opacity=".22"/>
          </g>
        </svg>
        <div class="name-tag">Chawu 🐶</div>
      </div>

      <div class="ground"></div>
    </div>

    <div class="tap">Toca la pantalla para soltar corazones ✨</div>
    <div class="petalos" id="petalos"></div>
    <div class="heart-burst" id="hearts"></div>
  </div>

  <script>
    /* ---- corazones al tocar ---- */
    const hearts = document.getElementById('hearts');
    function createHeart(x, y){
      const heart = document.createElement('div');
      heart.className = 'heart';
      const icons = ['💗','💖','🎂','✨','💕','🤍'];
      heart.textContent = icons[Math.floor(Math.random()*icons.length)];
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 3200);
    }
    function burst(x, y){
      for(let i=0;i<10;i++){
        setTimeout(() => createHeart(x + (Math.random()*80 - 40), y + (Math.random()*50 - 20)), i*90);
      }
    }
    document.addEventListener('click', (e) => burst(e.clientX, e.clientY));
    document.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      burst(t.clientX, t.clientY);
    }, {passive:true});

    /* ---- Chawu ladra y suelta el mensaje ---- */
    const lineas = [
      "Feliz cumpleaños, Valen 🎂🤍",
      "18 vueltas al sol. Hoy se cierra una etapa y empieza otra que va a estar increíble ✨",
      "Espero que este año nuevo de vida te traiga todo lo bonito que te mereces, porque eres una persona con un crecimiento muy lindo 🌱",
      "Te amo. Y te lo digo en serio: eres la persona que me devolvió las ganas de ser feliz y de volver a creer en el amor 💗",
      "Me haces sonreír todos los días, y cuando ando mal siempre resulta que ahí estás 🥺",
      "Incluso cuando ando mal o me equivoco, tú te sigues preocupando por mí, aun cuando estamos peleados. Y eso no se me olvida 🤍",
      "Estoy muy orgulloso de ti. Quiero quedarme mucho tiempo a tu lado para verte crecer y potenciar la mujer increíble que ya eres 🌷",
      "Nunca pierdas esa forma tan bonita que tienes de ser ✨",
      "Conocerte ha sido, sin exagerar, lo mejor de mi año. Gracias por todo lo que has hecho por mí 🙏",
      "Gracias por los momentos que hemos compartido, incluso los pequeños; para mí han tenido mucho valor. Ojalá pueda seguir conociendo muchas versiones bonitas de ti y creando recuerdos contigo 📸",
      "Sé que no siempre somos iguales ni pensamos de la misma manera, pero hay algo que tengo muy claro: eres una persona muy buena, y me siento agradecido de haberte conocido y de que formes parte de mi vida. Te amo mucho, preciosa 💗",
      "Y bueno... ya eres legal, ya no me puedes denunciar 😂",
      "Hoy no te toca hacer nada más que disfrutar. Que tengas un día precioso 🎈",
      "Mientras estés leyendo esto, lo único que quiero decirte es que te mereces ser la persona más feliz del mundo mundial 💘",
      "Feliz cumpleaños, preciosa. Espero que hoy pueda aportarte aunque sea un poquito de toda la felicidad que quiero que tengas a lo largo de toda tu vida 🎂"
    ];
    const btn = document.getElementById('barkBtn');
    const sndBtn = document.getElementById('sndBtn');
    const dogWrap = document.getElementById('dogWrap');
    const speech = document.getElementById('speech');
    const speechText = document.getElementById('speechText');
    const speechCue = document.getElementById('speechCue');
    const pawsBox = document.getElementById('paws');
    const petalos = document.getElementById('petalos');
    let i = -1;
    let sonido = true;

    /* ---- huellitas de progreso ---- */
    lineas.forEach(() => {
      const s = document.createElement('span');
      s.className = 'paw';
      s.textContent = '\uD83D\uDC3E';
      pawsBox.appendChild(s);
    });
    const paws = Array.from(pawsBox.children);

    /* ---- ladrido de Chawu (audio real, funciona en movil) ---- */
    const pool = [];
    for(let k = 0; k < 3; k++){
      const a = new Audio('ladrido.wav');
      a.preload = 'auto';
      a.volume = 0.85;
      pool.push(a);
    }
    let pi = 0;
    function ladrido(){
      if(!sonido) return;
      const a = pool[pi];
      pi = (pi + 1) % pool.length;
      try{
        a.pause();
        a.currentTime = 0;
        const pr = a.play();
        if(pr && pr.catch) pr.catch(function(){});
      }catch(e){}
    }

    sndBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sonido = !sonido;
      sndBtn.textContent = sonido ? '\uD83D\uDD0A' : '\uD83D\uDD07';
      ladrido();
    });

    /* ---- lluvia de petalos del final ---- */
    function lluviaDePetalos(){
      const colores = ['#ff8ec0', '#ffc23d', '#ffffff', '#ff5d99', '#ffe08a', '#fff2c2'];
      for(let k = 0; k < 26; k++){
        const p = document.createElement('div');
        p.className = 'petalo';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.background = colores[k % colores.length];
        p.style.animationDelay = (Math.random() * 1.8) + 's';
        p.style.animationDuration = (3.8 + Math.random() * 2.4) + 's';
        p.style.setProperty('--gir', (Math.random() * 760 - 380) + 'deg');
        p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
        petalos.appendChild(p);
        setTimeout(() => p.remove(), 8000);
      }
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      burst(e.clientX, e.clientY);
      ladrido();

      dogWrap.classList.remove('barking');
      void dogWrap.offsetWidth;
      dogWrap.classList.add('barking');
      setTimeout(() => dogWrap.classList.remove('barking'), 850);

      i++;
      if(i >= lineas.length) i = 0;
      const ultima = (i === lineas.length - 1);

      if(i === 0){
        paws.forEach(p => p.classList.remove('on'));
        speech.classList.remove('final');
        dogWrap.classList.remove('feliz');
        dogWrap.classList.remove('sentado');
      }

      setTimeout(() => {
        speechText.textContent = lineas[i];
        paws.forEach((p, k) => p.classList.toggle('on', k <= i));
        speech.classList.toggle('final', ultima);
        speech.classList.remove('pop');
        void speech.offsetWidth;
        speech.classList.add('pop');

        if(ultima){
          speechCue.textContent = 'con todo mi cari\u00f1o \uD83D\uDC8C';
          btn.textContent = 'leerlo otra vez \uD83D\uDC8C';
          dogWrap.classList.add('sentado');
          dogWrap.classList.add('feliz');
          lluviaDePetalos();
          const r = dogWrap.getBoundingClientRect();
          for(let k = 0; k < 8; k++){
            setTimeout(() => createHeart(
              r.left + r.width * 0.3 + Math.random() * 50,
              r.top + 16 + Math.random() * 34
            ), k * 150);
          }
        } else {
          speechCue.textContent = 'sigue tocando \uD83D\uDC3E';
          btn.textContent = 'que siga ladrando \uD83D\uDC3E';
        }
      }, 180);
    });
  </script>
</body>
</html>
